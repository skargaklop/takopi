name: CI

on:
  push:
    branches:
      - "master"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (${{ matrix.task }}/${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        task: [format, ruff, ty]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen --no-install-project
      - name: format check
        if: matrix.task == 'format'
        run: uv run --no-sync ruff format --check --diff src tests
      - name: ruff check
        if: matrix.task == 'ruff'
        run: uv run --no-sync ruff check src tests --output-format=github
      - name: ty check
        if: matrix.task == 'ty'
        run: uv run --no-sync ty check src tests

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen
      - name: pytest
        run: uv run --no-sync pytest tests/ -q --no-cov
      # Coverage gate on Linux only (single source of truth, not triple-counted).
      - name: coverage gate
        if: matrix.os == 'ubuntu-latest'
        run: uv run --no-sync pytest tests/ -q --cov=takopi --cov-branch --cov-report=term-missing --cov-fail-under=81

  build:
    name: build (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv build

  docs:
    name: docs (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen --no-install-project --group docs
      - run: uv run --no-sync python scripts/docs_prebuild.py && uv run --no-sync zensical build --clean
